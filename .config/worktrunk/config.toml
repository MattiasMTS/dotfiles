skip-shell-integration-prompt = true

[pre-start]
fetch = "git fetch --all --prune --quiet || true"

[post-start]
copy = "wt step copy-ignored"

# Bind this agent's existing cmux workspace; feature names are searchable in
# Cmd-P and native branch/PR tracking follows the worktree. New panes also
# inherit that directory. An actual terminal cd can override the report;
# another `wt switch` restores it. Outside cmux the helper is a no-op.
# post-switch runs after successful creation AND switching existing worktrees.
# The helper forwards cmux's inherited socket capability for detached hooks.
[post-switch]
cmux-session = "python3 ~/.config/worktrunk/cmux-session.py bind {{ worktree_path }}"

[post-remove]
cmux-session = "python3 ~/.config/worktrunk/cmux-session.py remove {{ worktree_path }}"

[projects]
