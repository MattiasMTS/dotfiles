# worktrunk (wt): git worktree manager shared by every coding agent.
# Shell integration is wired declaratively in home/programs/zsh.nix.
skip-shell-integration-prompt = true

# Worktree location: worktrunk default, sibling dirs `../<repo>.<branch>`.
# Agent-neutral; Claude Code worktrees land here too, because its
# WorktreeCreate hook (claude-code.nix) delegates to `wt switch --create`.

[pre-start]
fetch = "git fetch --prune --quiet || true"

[post-start]
# Lazy bootstrap: reflink-copy every gitignored file (node_modules, .env,
# target/, …) from the main worktree instead of cold-starting each one.
# Background, lowered I/O priority; logs in .git/wt/logs/. Move to
# [pre-start] if an agent ever races the copy with its first install.
copy = "wt step copy-ignored"

# One cmux workspace per session worktree, appended at the BOTTOM of the
# sidebar. cmux renders the branch line and PR pill natively, so the title
# carries the one thing it lacks: the title of the session that spawned it.
# That session's card gets a "⎇ <branch>" pill, so both cards point at each
# other. Only inside cmux; skips agent-*/worktree-agent-* subagent and
# /batch worktrees (bloat).
cmux = '''
if [ -n "$CMUX_WORKSPACE_ID" ] && command -v cmux >/dev/null 2>&1; then
  case "{{ branch }}" in
    agent-*|worktree-agent-*) : ;;
    *)
      d="$(git -C "{{ worktree_path }}" rev-parse --path-format=absolute --git-common-dir)/wt/cmux"
      mkdir -p "$d" 2>/dev/null || true
      printf '%s\n' "$CMUX_WORKSPACE_ID" >"$d/{{ branch | sanitize }}"
      parent=$(cmux rpc workspace.list '{}' 2>/dev/null \
        | jq -r --arg id "$CMUX_WORKSPACE_ID" \
          '.workspaces[] | select((.id|ascii_downcase)==($id|ascii_downcase)) | .title' 2>/dev/null \
        | head -1 | sed 's/^[^[:alnum:]]*//')
      # Title = the spawning session's title (cmux would otherwise say
      # "Terminal"); branch and path are rendered natively, so nothing repeats.
      ref=$(cmux new-workspace --cwd "{{ worktree_path }}" --focus false \
              --name "${parent:-{{ branch }}}" 2>/dev/null | awk '/^OK/{print $2}')
      if [ -n "$ref" ]; then
        n=$(cmux rpc workspace.list '{}' 2>/dev/null | jq -r '.workspaces|length')
        [ -n "$n" ] && cmux reorder-workspace --workspace "$ref" --index $((n-1)) >/dev/null 2>&1 || true
        # Reverse pointer, parent session -> this worktree's workspace id, so
        # cmux-agent-feed can mirror its progress bar onto the worktree card
        # with a single file read per tool call instead of an rpc lookup.
        # Refs like "workspace:11" renumber, so store the stable id.
        wid=$(cmux rpc workspace.list '{}' 2>/dev/null \
              | jq -r --arg r "$ref" '.workspaces[] | select(.ref==$r) | .id' 2>/dev/null | head -1)
        if [ -n "$wid" ]; then
          mkdir -p "$d/by-parent" 2>/dev/null || true
          printf '%s\n' "$wid" >"$d/by-parent/$CMUX_WORKSPACE_ID"
          # Tint worktree cards so agent scratch space reads apart from the
          # repo checkouts, which stay uncoloured as the control plane. Set
          # once at creation — a driver that repaints on every agent-finish
          # is what made per-workspace colouring laggy before. Teal avoids
          # amber/red/orange, which already mean agent status in the sidebar.
          cmux workspace-action --action set-color --color Teal \
            --workspace "$wid" >/dev/null 2>&1 || true
        fi
      fi
      cmux set-status "wt:{{ branch | sanitize }}" "⎇ {{ branch }}" \
        --workspace "$CMUX_WORKSPACE_ID" --priority 50 >/dev/null 2>&1 || true
      ;;
  esac
fi
'''

[pre-remove]
# Undo the above when `wt remove` drops the worktree: close its workspace
# (matched by directory) and clear the pill on the session that spawned it.
cmux = '''
if [ -n "$CMUX_WORKSPACE_ID" ] && command -v cmux >/dev/null 2>&1; then
  ws=$(cmux rpc workspace.list '{}' 2>/dev/null \
       | jq -r --arg d "{{ worktree_path }}" \
         '.workspaces[] | select(.current_directory==$d) | .ref' 2>/dev/null | head -1)
  [ -n "$ws" ] && cmux workspace close "$ws" >/dev/null 2>&1 || true
  f="$(git -C "{{ worktree_path }}" rev-parse --path-format=absolute --git-common-dir)/wt/cmux/{{ branch | sanitize }}"
  if [ -f "$f" ]; then
    parent=$(cat "$f")
    cmux clear-status "wt:{{ branch | sanitize }}" --workspace "$parent" >/dev/null 2>&1 || true
    rm -f "$f" "$(dirname "$f")/by-parent/$parent"
  fi
fi
'''

# `wt list --format=json` schema; wt asks to pin this on first run.
[list]
json-schema = 2
