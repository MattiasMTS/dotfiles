[package]
name = "pi_gameboy_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "pi_gameboy_core"

[dependencies]
gameboy = { git = "https://github.com/raphamorim/gameboy", rev = "78dda231647b40af371a4119ba6977a097dfc021", default-features = false, features = [
	"ffi",
] }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
